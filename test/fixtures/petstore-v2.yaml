openapi: 3.0.3
info: { title: Petstore, version: 2.0.0 }
servers:
  - url: https://{env}.petstore.test/v1
    variables:
      env: { default: api }
security:
  - bearerAuth: []
tags:
  - { name: pets }
  - { name: store }
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
        - { name: status, in: query, required: true, schema: { type: string }, example: available }
        - { name: sort, in: query, required: false, schema: { type: string }, example: name }
        - { name: X-Trace, in: header, required: false, schema: { type: string }, example: abc }
      responses: { '200': { description: ok } }
    post:
      operationId: createPet
      summary: Create pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses: { '201': { description: created } }
  /pet/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer }, example: 7 }
      responses: { '200': { description: ok } }
    delete:
      operationId: deletePet
      summary: Delete pet
      tags: [pets]
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer }, example: 7 }
      responses: { '204': { description: deleted } }
  /store/order:
    post:
      operationId: placeOrder
      summary: Place order
      tags: [store]
      security:
        - apiKeyAuth: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                petId: { type: integer, example: 3 }
                note: { type: string }
      responses: { '200': { description: ok } }
  /pets/{petId}/photos:
    get:
      parameters:
        - { name: petId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    apiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    Tag:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Rex }
        status: { type: string, enum: [available, sold] }
        age: { type: integer, example: 3 }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
