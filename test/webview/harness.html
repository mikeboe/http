<!DOCTYPE html>
<!--
  Test harness for the request editor webview. Open over file:// after `npm run build`.
  Query parameters: theme=dark|light (default dark), fixture=default|parseError|failed|image|empty.
  `acquireVsCodeApi` records posted messages on window.__posted; on `ready` it replays the fixture
  through window.postMessage, as VS Code would.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Webview harness</title>
<style>
  /* VS Code Dark+ (subset of the variables VS Code injects into webviews). */
  html.vscode-dark {
    --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif;
    --vscode-font-size: 13px;
    --vscode-font-weight: normal;
    --vscode-editor-font-family: "Droid Sans Mono", "monospace", monospace;
    --vscode-editor-font-size: 14px;
    --vscode-editor-background: #1e1e1e;
    --vscode-editor-foreground: #d4d4d4;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: rgba(204, 204, 204, 0.7);
    --vscode-disabledForeground: rgba(204, 204, 204, 0.5);
    --vscode-panel-border: rgba(128, 128, 128, 0.35);
    --vscode-focusBorder: #007fd4;
    --vscode-input-background: #3c3c3c;
    --vscode-input-foreground: #cccccc;
    --vscode-input-placeholderForeground: #a6a6a6;
    --vscode-dropdown-background: #3c3c3c;
    --vscode-dropdown-foreground: #f0f0f0;
    --vscode-dropdown-border: #3c3c3c;
    --vscode-checkbox-background: #3c3c3c;
    --vscode-checkbox-border: #6b6b6b;
    --vscode-button-background: #0e639c;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #1177bb;
    --vscode-button-secondaryBackground: #3a3d41;
    --vscode-button-secondaryForeground: #ffffff;
    --vscode-button-secondaryHoverBackground: #45494e;
    --vscode-panelTitle-activeBorder: #e7e7e7;
    --vscode-panelTitle-activeForeground: #e7e7e7;
    --vscode-panelTitle-inactiveForeground: rgba(231, 231, 231, 0.6);
    --vscode-sash-hoverBorder: #007fd4;
    --vscode-badge-background: #4d4d4d;
    --vscode-badge-foreground: #ffffff;
    --vscode-textLink-foreground: #3794ff;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-editor-selectionHighlightBackground: rgba(173, 214, 255, 0.15);
    --vscode-charts-green: #89d185;
    --vscode-charts-yellow: #cca700;
    --vscode-charts-blue: #3794ff;
    --vscode-charts-red: #f14c4c;
    --vscode-charts-purple: #b180d7;
    --vscode-charts-orange: #d18616;
    --vscode-testing-iconPassed: #73c991;
    --vscode-editorWarning-foreground: #cca700;
    --vscode-editorError-foreground: #f14c4c;
    --vscode-inputValidation-errorBackground: #5a1d1d;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-inputValidation-warningBackground: #352a05;
    --vscode-inputValidation-warningBorder: #b89500;
    --vscode-debugTokenExpression-name: #c586c0;
    --vscode-debugTokenExpression-string: #ce9178;
    --vscode-debugTokenExpression-number: #b5cea8;
    --vscode-debugTokenExpression-boolean: #4e94ce;
  }
  /* VS Code Light+. */
  html.vscode-light {
    --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif;
    --vscode-font-size: 13px;
    --vscode-font-weight: normal;
    --vscode-editor-font-family: "Droid Sans Mono", "monospace", monospace;
    --vscode-editor-font-size: 14px;
    --vscode-editor-background: #ffffff;
    --vscode-editor-foreground: #000000;
    --vscode-foreground: #616161;
    --vscode-descriptionForeground: #717171;
    --vscode-disabledForeground: rgba(97, 97, 97, 0.5);
    --vscode-panel-border: rgba(128, 128, 128, 0.35);
    --vscode-focusBorder: #0090f1;
    --vscode-input-background: #ffffff;
    --vscode-input-foreground: #616161;
    --vscode-input-placeholderForeground: #767676;
    --vscode-dropdown-background: #ffffff;
    --vscode-dropdown-foreground: #616161;
    --vscode-dropdown-border: #cecece;
    --vscode-checkbox-background: #ffffff;
    --vscode-checkbox-border: #919191;
    --vscode-button-background: #007acc;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #0062a3;
    --vscode-button-secondaryBackground: #5f6a79;
    --vscode-button-secondaryForeground: #ffffff;
    --vscode-button-secondaryHoverBackground: #4c5561;
    --vscode-panelTitle-activeBorder: #424242;
    --vscode-panelTitle-activeForeground: #424242;
    --vscode-panelTitle-inactiveForeground: rgba(66, 66, 66, 0.75);
    --vscode-sash-hoverBorder: #0090f1;
    --vscode-badge-background: #c4c4c4;
    --vscode-badge-foreground: #333333;
    --vscode-textLink-foreground: #006ab1;
    --vscode-list-hoverBackground: #e8e8e8;
    --vscode-editor-selectionHighlightBackground: rgba(173, 214, 255, 0.5);
    --vscode-charts-green: #388a34;
    --vscode-charts-yellow: #bf8803;
    --vscode-charts-blue: #1a85ff;
    --vscode-charts-red: #e51400;
    --vscode-charts-purple: #652d90;
    --vscode-charts-orange: #d18616;
    --vscode-testing-iconPassed: #388a34;
    --vscode-editorWarning-foreground: #bf8803;
    --vscode-editorError-foreground: #e51400;
    --vscode-inputValidation-errorBackground: #f2dede;
    --vscode-inputValidation-errorBorder: #be1100;
    --vscode-inputValidation-warningBackground: #f6f5d2;
    --vscode-inputValidation-warningBorder: #b89500;
    --vscode-debugTokenExpression-name: #9b46b0;
    --vscode-debugTokenExpression-string: #a31515;
    --vscode-debugTokenExpression-number: #098658;
    --vscode-debugTokenExpression-boolean: #0000ff;
  }
  /* VS Code's default webview body style, which the app must override. */
  body { padding: 0 20px; color: var(--vscode-foreground); font-family: var(--vscode-font-family); background: var(--vscode-editor-background); }
</style>
<script>
  const params = new URLSearchParams(location.search);
  document.documentElement.className = params.get('theme') === 'light' ? 'vscode-light' : 'vscode-dark';
  document.documentElement.dataset.fixture = params.get('fixture') || 'default';

  const request = {
    name: 'Create user', method: 'POST', url: '{{baseUrl}}/users/{{orgId}}/members',
    pathParams: { orgId: 'acme' },
    query: [{ name: 'notify', value: 'true' }, { name: 'dryRun', value: '1', enabled: false }],
    headers: [{ name: 'Content-Type', value: 'application/json' }, { name: 'X-Trace', value: '{{traceId}}' }],
    auth: { type: 'bearer', token: '{{apiToken}}' },
    body: { type: 'json', content: '{\n  "name": "Ada Lovelace",\n  "email": "ada@example.com"\n}' },
    settings: { timeout: '10s' },
  };
  const state = {
    type: 'state', request, errors: [],
    inherited: { auth: { type: 'bearer', token: '{{apiToken}}' }, authFrom: 'users', headers: [{ name: 'Accept', value: 'application/json' }] },
    env: { name: 'local', names: ['local', 'staging'] },
    variables: [
      { name: 'baseUrl', kind: 'variable', file: 'env/local.yaml', value: 'http://localhost:3000' },
      { name: 'orgId', kind: 'pathParam', value: 'acme' },
      { name: 'apiToken', kind: 'secret', file: 'env/local.env' },
      { name: 'traceId', kind: 'missing' },
    ],
    requestIds: ['users/create', 'users/get-by-id'],
  };
  const body = { id: 'u_8f2k1', name: 'Ada Lovelace', email: 'ada@example.com', admin: false, logins: 0, manager: null, tags: ['math', 'engines'], createdAt: '2026-10-22T09:14:03Z' };
  const response = {
    entryId: 'h2', timestamp: Date.UTC(2026, 9, 22, 9, 14, 3), ok: true, status: 201, statusText: 'Created', timeMs: 142, sizeBytes: 318,
    headers: [['content-type', 'application/json; charset=utf-8'], ['content-length', '318'], ['x-request-id', 'f81d4fae-7dec-11d0-a765-00a0c91e6bf6'], ['date', 'Thu, 22 Oct 2026 09:14:03 GMT']],
    contentType: 'application/json; charset=utf-8', bodyText: JSON.stringify(body),
    timeline: [
      { kind: 'request', text: 'POST http://localhost:3000/users/acme/members?notify=true', headers: [['authorization', '•••••'], ['content-type', 'application/json']] },
      { kind: 'response', text: 'HTTP 201 Created (142 ms)', headers: [['content-type', 'application/json; charset=utf-8']] },
    ],
  };
  const history = {
    type: 'history', items: [
      { entryId: 'h2', timestamp: Date.UTC(2026, 9, 22, 9, 14, 3), status: 201, ok: true },
      { entryId: 'h1', timestamp: Date.UTC(2026, 9, 22, 9, 2, 40), status: 500, ok: true },
      { entryId: 'h0', timestamp: Date.UTC(2026, 9, 21, 16, 30, 0), ok: false },
    ],
  };
  // 48x48 checkerboard PNG.
  const png = 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAIAAADYYG7QAAAAXElEQVR4nO3OQQ2AQBRDwVWBFRyiAGMoAgPbI/mHTtLjSzrruY7tzvvd7u9+AQEB1YGmjlMPBATUB5o6Tj0QEFAfaOo49UBAQH2gqePUAwEB9YGmjlMPBARUB/oA2y14U/bAOp8AAAAASUVORK5CYII=';

  function fixtureMessages(name) {
    switch (name) {
      case 'parseError':
        return [{ ...state, request: undefined, variables: [], errors: [{ message: 'Nested mappings are not allowed in compact mappings', line: 4, col: 12 }] }];
      case 'failed':
        return [state, { type: 'response', response: { entryId: 'h0', timestamp: Date.now(), ok: false, error: 'connect ECONNREFUSED 127.0.0.1:3000', timeline: [{ kind: 'request', text: 'POST http://localhost:3000/users/acme/members' }, { kind: 'error', text: 'connect ECONNREFUSED 127.0.0.1:3000' }] } }, history];
      case 'image':
        return [state, { type: 'response', response: { ...response, contentType: 'image/png', bodyText: undefined, bodyBase64: png, sizeBytes: 136, headers: [['content-type', 'image/png']] } }, history];
      case 'empty':
        return [{ ...state, request: { name: 'New', method: 'GET', url: 'https://example.com', pathParams: {}, query: [], headers: [], body: { type: 'none' }, settings: {} }, variables: [], env: { names: [] }, inherited: { auth: { type: 'none' }, headers: [] } }, { type: 'history', items: [] }];
      default:
        return [state, { type: 'response', response }, history];
    }
  }

  window.__posted = [];
  window.__fixture = { state, response, history };
  window.acquireVsCodeApi = () => ({
    postMessage(m) {
      window.__posted.push(m);
      if (m.type === 'ready') for (const msg of fixtureMessages(document.documentElement.dataset.fixture)) window.postMessage(msg, '*');
    },
    // Kept in sessionStorage so it survives a reload, like VS Code's webview state.
    getState() { const s = sessionStorage.getItem('vscodeState'); return s ? JSON.parse(s) : undefined; },
    setState(s) { sessionStorage.setItem('vscodeState', JSON.stringify(s)); return s; },
  });
</script>
<link rel="stylesheet" href="../../dist/webview.css">
</head>
<body>
<div id="app"></div>
<script src="../../dist/webview.js"></script>
</body>
</html>
